name: ThreatScope verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: threatscope_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U test -d threatscope_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check backend common node_simulator migrations scripts tests research
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:isolated-ci-only@127.0.0.1:5432/threatscope_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait backend correlation explanations frontend
      - run: docker compose --profile setup run --rm enroll
      - run: docker compose --profile demo up -d orion lyra vega
      - run: python scripts/compose_smoke.py
      - if: always()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down
