name: ThreatScope verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: threatscope_test
        ports: [5432:5432]
        options: --health-cmd "pg_isready -U test -d threatscope_test" --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check backend common node_simulator migrations scripts tests research
      - run: uv run pytest -q
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://test:isolated-ci-only@127.0.0.1:5432/threatscope_test
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  native-demo:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.12"
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $server = Start-Process .venv/Scripts/python.exe -ArgumentList '-m','scripts.demo' -PassThru -NoNewWindow -RedirectStandardOutput demo.stdout -RedirectStandardError demo.stderr
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 120 -and -not $server.HasExited; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri http://127.0.0.1:5173/health/ready -TimeoutSec 1
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw "Native demo failed to start" }
            $dashboard = Invoke-WebRequest -Uri http://127.0.0.1:5173/
            if ($dashboard.Content -notmatch '<title>ThreatScope</title>') { throw "Dashboard missing" }
            foreach ($scenario in @('auth_attack', 'traffic_attack')) {
              .venv/Scripts/python.exe -m scripts.demo_check --scenario $scenario
              if ($LASTEXITCODE -ne 0) { throw "Scenario failed: $scenario" }
            }
          } finally {
            if (-not $server.HasExited) { Stop-Process -Id $server.Id }
            Get-Content demo.stdout,demo.stderr -Tail 60
          }
