global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: threatscope
    environment: local

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus

  - job_name: threatscope-backend
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: backend
          component: api

  - job_name: threatscope-frontend
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets:
          - frontend:5173
        labels:
          service: frontend
          component: ui

  - job_name: postgres
    static_configs:
      - targets:
          - postgres:5432
        labels:
          service: postgres
          component: database

  - job_name: redis
    static_configs:
      - targets:
          - redis:6379
        labels:
          service: redis
          component: cache

  - job_name: kafka
    static_configs:
      - targets:
          - kafka:9092
        labels:
          service: kafka
          component: streaming

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana
          component: dashboards
