[project]
name = "threatscope"
version = "0.2.0"
description = "Policy-controlled collaborative threat evidence and local explanations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1", "argon2-cffi>=23.1", "prometheus-client>=0.21,<1",
  "scikit-learn>=1.6,<2", "numpy>=2.1,<3"
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "pip-audit>=2.7,<3"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires an isolated PostgreSQL test database", "model: requires a real local model endpoint"]
[tool.ruff]
target-version = "py311"
line-length = 110
exclude = ["research/papers", ".venv"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
