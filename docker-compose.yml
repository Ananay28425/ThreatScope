# Purpose: one deployment definition with durable state and optional inference.
x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: postgresql+asyncpg://threatscope:${APP_DATABASE_PASSWORD:?Run scripts/bootstrap.py}@postgres:5432/threatscope
    ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    LLM_ENABLED: ${LLM_ENABLED:-false}
    DEMO_ACCESS: "true"
    LLM_URL: ${LLM_URL:-http://127.0.0.1:18080/v1}
    LLM_API_KEY: ${LLM_API_KEY:-}
    LLM_MODEL: ${LLM_MODEL:-Qwen3-1.7B-Q4_K_M}
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_USER: threatscope_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Run scripts/bootstrap.py}
      POSTGRES_DB: threatscope
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/001-runtime-role.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U threatscope_owner -d threatscope]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgresql+asyncpg://threatscope_owner:${POSTGRES_PASSWORD:?Run scripts/bootstrap.py}@postgres:5432/threatscope
    command: [python, -m, alembic, upgrade, head]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
  enroll:
    <<: *app
    user: ${LOCAL_UID:-10001}:${LOCAL_GID:-10001}
    profiles: [setup]
    command: [python, -m, backend.app.admin, seed-demo, --output, /private/demo-credentials.json]
    volumes: [./.runtime/private:/private]
    restart: "no"
  evaluate:
    <<: *app
    profiles: [evaluation]
    user: ${LOCAL_UID:-10001}:${LOCAL_GID:-10001}
    environment: {}
    command: [python, -m, scripts.demo_check, --url, "http://frontend:8080", --agent-url, "http://backend:8000", --credentials, /private/demo-credentials.json]
    volumes: [./.runtime/private:/private:ro]
    depends_on:
      frontend:
        condition: service_started
      correlation:
        condition: service_started
      explanations:
        condition: service_started
    restart: "no"
  backend:
    <<: *app
    command: [python, -m, uvicorn, backend.main:app, --host, 0.0.0.0, --port, "8000", --workers, "1", --no-access-log]
    ports: [127.0.0.1:8000:8000]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 15
  correlation:
    <<: *app
    command: [python, -m, backend.app.worker]
  explanations:
    <<: *app
    command: [python, -m, backend.app.explain_worker]
  frontend:
    build: ./frontend
    ports: [127.0.0.1:5173:8080]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
  orion:
    <<: *app
    profiles: [demo]
    user: root
    environment: {BACKEND_URL: 'http://backend:8000'}
    command: [python, -m, node_simulator.container_entrypoint, --credentials, /private/node.json, --state, /state/ledger.db, --seed, "41"]
    volumes: [./.runtime/private/orion-node.json:/private/node.json:ro, orion_state:/state]
  lyra:
    <<: *app
    profiles: [demo]
    user: root
    environment: {BACKEND_URL: 'http://backend:8000'}
    command: [python, -m, node_simulator.container_entrypoint, --credentials, /private/node.json, --state, /state/ledger.db, --seed, "42"]
    volumes: [./.runtime/private/lyra-node.json:/private/node.json:ro, lyra_state:/state]
  vega:
    <<: *app
    profiles: [demo]
    user: root
    environment: {BACKEND_URL: 'http://backend:8000'}
    command: [python, -m, node_simulator.container_entrypoint, --credentials, /private/node.json, --state, /state/ledger.db, --seed, "43"]
    volumes: [./.runtime/private/vega-node.json:/private/node.json:ro, vega_state:/state]
volumes:
  postgres_data:
  orion_state:
  lyra_state:
  vega_state:
